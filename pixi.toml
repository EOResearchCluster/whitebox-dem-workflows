[workspace]
name = "whitebox-dem-workflows"
version = "1.0.0"
description = "Comprehensive DEM analysis workflows using WhiteboxTools"
authors = ["EOResearchCluster"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]
# Run all workflows
run-all = "bash run_all_workflows.sh dem.tif"

# Run individual workflows
hydrology = "bash 01_hydrology.sh dem.tif"
geomorphometry = "bash 02_geomorphometry.sh dem.tif"
stream-network = "bash 03_stream_network.sh dem.tif"
morphometry = "bash 04_morphometry.sh dem.tif"

# Python wrapper
run-py = "python run_workflows.py --all"
list-workflows = "python run_workflows.py --list"

# Utilities
load-utils = "source utils.sh"
view = { cmd = "python view_raster.py" }
tiffplot = "python tiffplot.py"

# Cleanup
clean = "rm -rf outputs/ logs/"

[dependencies]
python = ">=3.11,<3.13"
whitebox_tools = "*"
tifffile = "*"
rasterio = ">=1.3"
matplotlib = ">=3.7"
numpy = ">=1.24"

# Optional development tools
[feature.dev.dependencies]
ipython = "*"
jupyter = "*"

[feature.dev.tasks]
notebook = "jupyter notebook"

# Define dev environment to use the dev feature
[environments]
dev = ["dev"]
