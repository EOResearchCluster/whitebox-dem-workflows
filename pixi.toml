[workspace]
name = "whitebox-dem-workflows"
version = "1.0.0"
description = "Comprehensive DEM analysis workflows using WhiteboxTools"
authors = ["EOResearchCluster"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]
# Run all workflows
run-all = "python run_workflows.py --all"

# Run individual workflows
hydrology = "python 01_hydrology.py dem.tif outputs/01_hydrology"
geomorphometry = "python 02_geomorphometry.py dem.tif outputs/02_geomorphometry"
stream-network = "python 03_stream_network.py dem.tif outputs/01_hydrology outputs/03_stream_network"
morphometry = "python 04_morphometry.py dem.tif outputs/04_morphometry outputs/02_geomorphometry"

# Python workflow manager
list-workflows = "python run_workflows.py --list"

# Utilities
view = { cmd = "python view_raster.py" }
tiffplot = "python tiffplot.py"

# Cleanup (cross-platform Python)
clean = "python -c \"import shutil; import pathlib; [shutil.rmtree(p, ignore_errors=True) for p in [pathlib.Path('outputs'), pathlib.Path('logs')]]\""

[dependencies]
python = ">=3.11,<3.13"
whitebox_workflows = "*"
tifffile = "*"
rasterio = ">=1.3"
matplotlib = ">=3.7"
numpy = ">=1.24"

# Optional development tools
[feature.dev.dependencies]
ipython = "*"
jupyter = "*"

[feature.dev.tasks]
notebook = "jupyter notebook"

# Define dev environment to use the dev feature
[environments]
dev = ["dev"]
