[project]
name = "whitebox-dem-workflows"
version = "1.0.0"
description = "Comprehensive DEM analysis workflows using WhiteboxTools"
authors = ["EOResearchCluster"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]
# Run all workflows
run-all = "python run_workflows.py --all"

# Run individual workflows
hydrology = "python run_workflows.py --workflow hydrology"
geomorphometry = "python run_workflows.py --workflow geomorphometry"
stream-network = "python run_workflows.py --workflow stream_network"
morphometry = "python run_workflows.py --workflow morphometry"

# Utilities
list-workflows = "python run_workflows.py --list"
view = { cmd = "python view_raster.py" }

# Cleanup (cross-platform)
clean = "python -c \"import shutil; shutil.rmtree('outputs', ignore_errors=True); shutil.rmtree('logs', ignore_errors=True)\""

[dependencies]
python = ">=3.11,<3.13"
whitebox_tools = "*"
rasterio = ">=1.3"
matplotlib = ">=3.7"
numpy = ">=1.24"

# Optional development tools
[feature.dev.dependencies]
ipython = "*"
jupyter = "*"

[feature.dev.tasks]
notebook = "jupyter notebook"

# Define dev environment to use the dev feature
[environments]
dev = ["dev"]
