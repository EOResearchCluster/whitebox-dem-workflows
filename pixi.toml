[workspace]
name = "whitebox-dem-workflows"
version = "1.0.0"
description = "Comprehensive DEM analysis workflows using WhiteboxTools"
authors = ["EOResearchCluster"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]
# Run all workflows
run-all = "bash run_all_workflows.sh dem.tif"

# Run individual workflows (with logging via wrapper script)
hydrology = { cmd = "bash -c 'mkdir -p logs && exec bash 01_hydrology.sh dem.tif 2>&1 | tee logs/01_hydrology_$(date +%Y%m%d_%H%M%S).log'" }
geomorphometry = { cmd = "bash -c 'mkdir -p logs && exec bash 02_geomorphometry.sh dem.tif 2>&1 | tee logs/02_geomorphometry_$(date +%Y%m%d_%H%M%S).log'" }
stream-network = { cmd = "bash -c 'mkdir -p logs && exec bash 03_stream_network.sh dem.tif 2>&1 | tee logs/03_stream_network_$(date +%Y%m%d_%H%M%S).log'" }
morphometry = { cmd = "bash -c 'mkdir -p logs && exec bash 04_morphometry.sh dem.tif 2>&1 | tee logs/04_morphometry_$(date +%Y%m%d_%H%M%S).log'" }

# Python wrapper (calls .sh scripts)
run-py = "python run_workflows.py --all"
list-workflows = "python run_workflows.py --list"

# Native Python workflows (using whitebox-workflows package)
hydrology-py = "python 01_hydrology.py"
geomorphometry-py = "python 02_geomorphometry.py"
stream-network-py = "python 03_stream_network.py"
morphometry-py = "python 04_morphometry.py"

# Utilities
load-utils = "source utils.sh"
view = { cmd = "python view_raster.py" }
tiffplot = "python tiffplot.py"

# Cleanup
clean = "rm -rf outputs/ logs/"

[dependencies]
python = ">=3.11,<3.13"
whitebox_tools = "*"
tifffile = "*"
rasterio = ">=1.3"
matplotlib = ">=3.7"
numpy = ">=1.24"

[pypi-dependencies]
whitebox = "*"

# Optional development tools
[feature.dev.dependencies]
ipython = "*"
jupyter = "*"

[feature.dev.tasks]
notebook = "jupyter notebook"

# Define dev environment to use the dev feature
[environments]
dev = ["dev"]
